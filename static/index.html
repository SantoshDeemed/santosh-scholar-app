<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355B"><link rel="manifest" href="/manifest.json">
<title>Santosh Deemed to be University - Scholar App</title>
<style>
:root{--red:#B3202A;--gold:#C9A227;--navy:#12355B;--bg:#F4F6FA;--card:#fff;--ink:#1b2432;--mute:#5d6b7e;--line:#dde3ec}
*{box-sizing:border-box}html{background:#cfd8e6}body{margin:0 auto;max-width:430px;min-height:100vh;box-shadow:0 0 30px rgba(18,53,91,.25);background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:78px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.2em 0}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:5}
header img{height:42px}header b{flex:1;font-family:Georgia,serif;font-size:1.05rem;line-height:1.1}header small{display:block;font:.72rem system-ui;opacity:.8}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 3px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:600;cursor:pointer;min-height:44px}
button.alt{background:var(--navy)}button.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.sm{padding:6px 10px;min-height:0;font-size:.85rem}
button:disabled{opacity:.5}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:3px solid var(--gold);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{background:none;color:var(--mute);flex:1;min-width:76px;border-radius:0;font-size:.78rem;font-weight:600;padding:10px 6px}
nav button.on{color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:#e8eef7;color:var(--navy)}
.ok{background:#dff3e4;color:#14692c}.bad{background:#fbe0e0;color:#a31212}
.msg{padding:10px;border-radius:8px;margin:8px 0}.msg.e{background:#fbe0e0;color:#8f1010}.msg.g{background:#dff3e4;color:#14692c}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.stats b{font:700 2rem Georgia,serif;color:var(--red);display:block}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}video,canvas{width:100%;border-radius:10px;background:#000;max-height:50vh}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px}.mute{color:var(--mute)}.hide{display:none!important}
body.admin{max-width:none;box-shadow:none}
@media(min-width:900px){body.admin{padding-bottom:0}
body.admin nav{left:0;top:68px;bottom:0;transform:none;width:210px;max-width:none;flex-direction:column;border-top:0;border-right:3px solid var(--gold);padding-top:8px}
body.admin nav button{text-align:left;padding:15px 20px;font-size:.95rem;flex:none}
body.admin nav button.on{box-shadow:inset 4px 0 0 var(--red);background:#f6eaeb}
body.admin main{margin-left:210px;max-width:1200px;padding:26px}
body.admin .stats{grid-template-columns:repeat(4,1fr)}
body.admin .card form .row{flex-wrap:nowrap}}
#login{max-width:380px;margin:8vh auto;text-align:center}#login img{width:150px}
#login{max-width:430px;margin:0 auto;padding:26px 22px 0;text-align:left;min-height:100vh;display:flex;flex-direction:column}
#login img{width:92px;margin-bottom:22px}
#login .eyebrow{color:var(--red);font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
#login h1{font:800 2.25rem/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111827;margin:10px 0 12px}
#login .sub{color:#6b7280;font-size:1.05rem;margin:0 0 26px}
#login form{flex:1;display:flex;flex-direction:column}
#login label{color:#111827;font-weight:600;font-size:.9rem;margin:14px 0 8px}
#login .fld{background:#f1f3f6;border:0;border-radius:14px;padding:17px 16px;font-size:1rem}
.pw{position:relative}.pw .fld{padding-right:52px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;color:#6b7280;padding:8px;min-height:0}
#login .info{display:flex;gap:12px;align-items:center;background:#e4eaff;color:#1e3a8a;border-radius:14px;padding:14px;margin-top:22px;font-size:.9rem}
#login .signin{margin-top:auto;position:sticky;bottom:16px;width:100%;background:#c8102e;border-radius:18px;padding:18px;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px rgba(200,16,46,.3)}
#login form>.info{margin-bottom:26px}

/* ===== student app ===== */
body.stu header{display:none}body.stu main{padding:0}
body.stu nav{overflow:visible;border-top:0;border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(18,53,91,.14);height:68px;align-items:center}
body.stu nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;background:none;color:#8a96a8;min-width:0}
body.stu nav button.on{color:var(--red);box-shadow:none}
body.stu nav button.fab{flex:none;width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#e11d3a,#a30f26);color:#fff;margin-top:-38px;padding:0;justify-content:center;box-shadow:0 10px 20px rgba(200,16,46,.4),0 0 0 6px #fff}
.hero{background:linear-gradient(165deg,#0b2a55 0%,#164a8f 60%,#1f6fd1 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 62px;border-radius:0 0 34px 34px;border-bottom:4px solid var(--gold)}
.hero .top{display:flex;align-items:center;gap:12px}.hero .top img{height:46px;background:#fff;border-radius:10px;padding:3px}
.hero .top div{flex:1;line-height:1.2}.hero small{opacity:.8;font-size:.8rem}.hero b{font-size:1.15rem;display:block}
.bellb{background:rgba(255,255,255,.14);width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;position:relative;color:#fff}
.bellb i{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:#ff4d5e;border:2px solid #164a8f}
.sum{display:flex;align-items:center;gap:18px;margin:22px 0 16px}
.ringp{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(#4ade80 calc(var(--p)*1%),rgba(255,255,255,.2) 0);display:grid;place-items:center;position:relative;flex:none}
.ringp:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#12417f}.ringp b{position:relative;font-size:1.45rem}
.sum span{display:block;opacity:.85}.sum strong{font-size:1.1rem}
.sum .pa{display:flex;gap:8px;margin-top:8px}.pa em{font-style:normal;padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:700}
.pa .g{background:#16a34a}.pa .r{background:#dc2626}
.outl{width:100%;background:transparent;border:1.5px solid rgba(255,255,255,.85);border-radius:12px;display:flex;gap:8px;align-items:center;justify-content:center}
.sbody{padding:14px}.sbody>h2{display:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;margin:-38px 14px 14px;padding:18px 8px;border-radius:22px;box-shadow:0 10px 30px rgba(18,53,91,.12)}
.grid button{background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:.74rem;font-weight:500;padding:0;min-height:0}
.grid i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,#fff),0 4px 10px color-mix(in srgb,var(--c) 18%,transparent)}
.sec{margin:18px 16px 8px;color:var(--navy);font-size:1.05rem}.hm{padding:0 14px}
.tt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:#f1f4f9;border-radius:14px;padding:12px 14px}.chip small{color:var(--mute);display:block}.chip b{font-size:1.5rem;color:#9aa6b8}.chip.ok{background:#e3f6ea}.chip.ok b{color:#14692c}
.bar{display:flex;align-items:center;gap:10px;background:linear-gradient(165deg,#0b2a55,#1b5aa8);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 22px;border-radius:0 0 26px 26px;border-bottom:3px solid var(--gold)}
.bar button{background:rgba(255,255,255,.15);width:40px;height:40px;padding:0;border-radius:50%;font-size:1.4rem;line-height:1}.bar b{font-size:1.1rem}
.sbody{margin-top:-12px}
.vw{position:relative;border-radius:22px;overflow:hidden;background:#0b1b33;aspect-ratio:3/4}.vw video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);max-height:none;border-radius:0}
.vw .fr{position:absolute;inset:14% 16%;border:3px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 999px rgba(11,27,51,.35)}
.big{width:100%;margin-top:12px;background:linear-gradient(145deg,#e11d3a,#a30f26);border-radius:16px;padding:17px;font-size:1.1rem;display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(200,16,46,.3)}
.done{text-align:center;color:#14692c}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh button{background:#eef2f8;color:var(--navy);width:40px;height:40px;padding:0;font-size:1.3rem}
.wk,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.wk span{font-size:.75rem;color:var(--mute);font-weight:700;padding-bottom:4px}
.dc{aspect-ratio:1;padding:0;min-height:0;border-radius:12px;font-weight:700;font-size:.9rem;background:#eef2f8;color:#7a8799}
.dc.p{background:#16a34a;color:#fff}.dc.a{background:#dc2626;color:#fff}.dc.s{background:#f6f7fa;color:#c3cad6}
.dc.td{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--navy)}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:.8rem;color:var(--mute)}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.lg .p{background:#16a34a}.lg .a{background:#dc2626}.lg .f{background:#cfd7e4}
.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.s3 .card{margin:0;text-align:center;padding:12px 6px}.s3 b{display:block;font:800 1.6rem Georgia,serif}
.sk{height:170px;margin:14px;border-radius:18px;background:linear-gradient(90deg,#e6ebf3 25%,#f3f6fb 50%,#e6ebf3 75%);background-size:200% 100%;animation:sh 1s linear infinite}@keyframes sh{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.sk{animation:none}}
</style></head><body>
<div id="login" class="hide"><img src="/logo.png" alt="Santosh logo">
<div class="eyebrow">Santosh Deemed to be University</div><h1>PhD &amp; JRF<br>Scholar Portal</h1>
<p class="sub">Sign in with the phone number and password issued by the University admin.</p>
<form id="lf"><label>Phone number or Student ID</label><input id="u" class="fld" placeholder="10-digit mobile number" autocomplete="username" required>
<label>Password</label><div class="pw"><input id="p" class="fld" type="password" placeholder="Enter password" autocomplete="current-password" required><button type="button" id="eye" aria-label="Show password">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<div id="le"></div>
<div class="info"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg><span>Don't have credentials? Contact the university admin office to get your ID and password.</span></div>
<button class="signin"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg> Sign In</button></form></div>
<div id="app" class="hide"><header><img src="/logo.png" alt=""><b>Santosh Deemed to be University<small id="who"></small></b><button class="sm ghost" id="bell" style="display:none"></button><button class="sm ghost" onclick="logout()">Log out</button></header>
<main id="v"></main><nav id="nav"></nav></div>
<script>
const $=s=>document.querySelector(s);let T=localStorage.t,ME=null,STU=[];
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){const h={};if(T)h.Authorization='Bearer '+T;if(o.json){h['Content-Type']='application/json';o.body=JSON.stringify(o.json)}
 const r=await fetch('/api'+p,{method:o.method,body:o.body,headers:h});const d=await r.json().catch(()=>({}));
 if(r.status===401&&p!=='/login'){logout();throw Error('Session ended')}if(!r.ok)throw Error(d.detail||'Something went wrong');return d}
const msg=(id,t,ok)=>{$(id).innerHTML=t?`<div class="msg ${ok?'g':'e'}">${e(t)}</div>`:''};
const fd=t=>t?new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'';
function logout(){document.body.classList.remove('admin','stu');localStorage.removeItem('t');T=null;ME=null;stopCam();show()}
$('#eye').onclick=()=>{const i=$('#p');i.type=i.type==='password'?'text':'password'};
$('#lf').onsubmit=async ev=>{ev.preventDefault();const sb=$('.signin');sb.disabled=true;sb.lastChild.textContent=' Signing in...';try{const d=await api('/login',{method:'POST',json:{uid:$('#u').value,password:$('#p').value}});T=d.token;localStorage.t=T;ME=d.user;show()}catch(x){msg('#le',x.message)}sb.disabled=false;sb.lastChild.textContent=' Sign In'};
const ADMIN=[['dash','Home'],['stu','Students'],['att','Attendance'],['mtg','DRC/RAC'],['res','Research'],['upd','Updates'],['set','Campus']];
const STUDENT=[['home','Home']];
async function show(){
 if(!T){$('#login').classList.remove('hide');$('#app').classList.add('hide');return}
 try{ME=ME||await api('/me')}catch{return}
 document.body.classList.toggle('admin',ME.role!=='student');document.body.classList.toggle('stu',ME.role==='student');$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=`${ME.name} (${ME.uid})`;
 const items=ME.role==='student'?STUDENT:ADMIN;$('#nav').innerHTML=ME.role==='student'?SNAV:items.map(([k,l])=>`<button data-k="${k}" onclick="go('${k}')">${l}</button>`).join('');
 if(ME.role!=='student')STU=await api('/students');go(items[0][0]);if(ME.role!=='student')bellCheck()}
async function bellCheck(){const u=await api('/updates');const seen=+localStorage.seen||0;const n=u.filter(x=>x.id>seen).length;const b=$('#bell');
 b.style.display=n?'':'none';b.textContent=`${n} new`;b.onclick=()=>go('upd')}
let cam=null;function stopCam(){cam&&cam.getTracks().forEach(t=>t.stop());cam=null}
async function go(k){stopCam();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 $('#v').innerHTML='<div class="sk"></div>';try{$('#v').innerHTML=wrap(k,await V[k]())}catch(x){$('#v').innerHTML=`<div class="msg e">${e(x.message)}</div>`}if(B[k])B[k]()}
const opts=()=>STU.filter(s=>s.role==='student').map(s=>`<option value="${s.id}">${e(s.name)} (${e(s.uid)})</option>`).join('');
const attTable=(r,adm)=>`<div class="scroll"><table><tr><th>Photo</th>${adm?'<th>Student</th>':''}<th>Time</th><th>Type</th><th>Status</th><th>Dist</th></tr>${r.map(a=>`<tr><td><a href="/uploads/${a.photo}" target="_blank"><img class="thumb" src="/uploads/${a.photo}" alt="selfie"></a></td>${adm?`<td>${e(a.name)}<br><span class="mute">${e(a.uid)}</span></td>`:''}<td>${fd(a.ts)}</td><td>${a.kind.toUpperCase()}</td><td><span class="pill ${a.status==='present'?'ok':'bad'}">${a.status}</span></td><td>${Math.round(a.dist)} m<br><a href="https://maps.google.com/?q=${a.lat},${a.lng}" target="_blank">map</a></td></tr>`).join('')||'<tr><td colspan=6 class="mute">No records yet.</td></tr>'}</table></div>`;
const V={
async dash(){const d=await api('/dashboard');return `<h2>Dashboard</h2><div class="stats"><div class="card"><b>${d.students}</b>Scholars</div><div class="card"><b>${d.present}</b>Present today</div><div class="card"><b>${d.pending}</b>Pending DRC/RAC</div><div class="card"><b>${d.reports}</b>Reports awaiting feedback</div></div>`},
async att(){const adm=ME.role!=='student';const r=await api('/attendance'+(adm?'?day='+(window.D||''):''));
 if(adm)return `<h2>Attendance</h2><div class="card row"><div><label>Date</label><input type="date" id="ad" value="${window.D||''}"></div><button class="alt" onclick="D=$('#ad').value;go('att')">Filter</button><button class="ghost" onclick="csv()">Export CSV</button></div><div class="card">${attTable(r,true)}</div>`;
 return attStu(r)},
async stu(){return `<h2>Scholars</h2><div class="card"><form id="sf"><div class="row"><div><label>Full name</label><input name="name" required></div><div><label>Phone number</label><input name="phone" required pattern="[0-9+ ]{10,15}"></div></div>
 <div class="row"><div><label>Department</label><input name="dept"></div><div><label>Category</label><select name="category"><option>PhD</option><option>JRF</option></select></div><div><label>Supervisor</label><input name="supervisor"></div></div><div id="sm"></div><button style="margin-top:10px">Register and send ID + password</button></form></div>
 <div class="card scroll"><table><tr><th>Name</th><th>ID</th><th>Phone</th><th>Cat.</th><th></th></tr>${STU.map(s=>`<tr><td>${e(s.name)}<br><span class="mute">${e(s.dept)} ${e(s.supervisor)}</span></td><td>${e(s.uid)}</td><td>${e(s.phone)}</td><td>${e(s.category)}</td><td><button class="sm ghost" onclick="rs(${s.id})">Reset</button> <button class="sm" onclick="dl(${s.id})">Delete</button></td></tr>`).join('')}</table></div>`},
async mtg(){const r=await api('/meetings');const adm=ME.role==='admin';return `<h2>DRC &amp; RAC</h2>${adm?`<div class="card"><form id="mf"><div class="row"><div><label>Scholar</label><select name="user_id">${opts()}</select></div><div><label>Type</label><select name="kind"><option>DRC</option><option>RAC</option></select></div></div><label>Title</label><input name="title" required><div class="row"><div><label>Date and time</label><input type="datetime-local" name="date" required></div><div><label>Committee members</label><input name="members"></div></div><div id="mm"></div><button style="margin-top:10px">Schedule meeting</button></form></div>`:''}
 ${r.map(m=>`<div class="card"><span class="pill">${m.kind}</span> <span class="pill ${m.status==='approved'?'ok':m.status==='rejected'?'bad':''}">${m.status}</span><h3>${e(m.title)}</h3><div class="mute">${e(m.name)} - ${fd(m.date)}<br>Members: ${e(m.members)||'-'}</div>${m.minutes?`<p><b>Minutes:</b> ${e(m.minutes)}</p>`:''}
 ${ME.role!=='student'?`<textarea id="mi${m.id}" placeholder="Minutes / remarks">${e(m.minutes)}</textarea><div class="row" style="margin-top:6px"><button class="sm" onclick="mu(${m.id},'approved')">Approve</button><button class="sm ghost" onclick="mu(${m.id},'rejected')">Reject</button><button class="sm alt" onclick="mu(${m.id},'completed')">Mark completed</button></div>`:''}</div>`).join('')||'<div class="card mute">No meetings yet.</div>'}`},
async res(){const r=await api('/reports');const st=ME.role==='student';return `<h2>Research work</h2>${st?`<div class="card"><form id="rf"><label>Title</label><input name="title" required><div class="row"><div><label>Milestone / thesis chapter</label><input name="milestone"></div><div><label>Status</label><select name="status"><option>In progress</option><option>Completed</option><option>Blocked</option></select></div></div><label>Publications</label><input name="publications"><label>Progress notes</label><textarea name="notes" rows="3"></textarea><div id="rm"></div><button style="margin-top:10px">Submit report</button></form></div>`:''}
 ${r.map(x=>`<div class="card"><span class="pill">${e(x.status)}</span><h3>${e(x.title)}</h3><div class="mute">${st?'':e(x.name)+' - '}${fd(x.created)}<br>Milestone: ${e(x.milestone)||'-'} | Publications: ${e(x.publications)||'-'}</div><p>${e(x.notes)}</p>
 ${st?(x.feedback?`<p><b>Supervisor feedback:</b> ${e(x.feedback)}</p>`:''):`<textarea id="fb${x.id}" placeholder="Feedback">${e(x.feedback)}</textarea><button class="sm" style="margin-top:6px" onclick="sf(${x.id})">Save feedback</button>`}</div>`).join('')||'<div class="card mute">No reports yet.</div>'}`},
async upd(){const r=await api('/updates');localStorage.seen=r[0]?.id||0;$('#bell').style.display='none';return `<h2>Class updates</h2>${ME.role==='admin'?`<div class="card"><form id="uf"><label>Title</label><input name="title" required><label>Message</label><textarea name="body" rows="3" required></textarea><label>Send to</label><select name="user_id"><option value="">All scholars</option>${opts()}</select><div id="um"></div><button style="margin-top:10px">Post and notify</button></form></div>`:''}
